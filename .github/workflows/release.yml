name: Release

# Builds the desktop installers on Windows, macOS and Linux and publishes them, with checksums and the
# changelog entry, as a GitHub Release. Trigger: push a version tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
#
# Optional repository variable HOPLINE_SIGNALING_URL (Settings → Secrets and variables → Actions → Variables):
# the signaling server the downloadable app connects to by default, e.g. wss://hopline.example.com/ws.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Installers are not code-signed yet (see the README's install notes).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build the web app
        run: npm run build
      - name: Build installers
        run: npm run dist -w @hopline/desktop -- ${{ matrix.target }} --publish never
        env:
          HOPLINE_SIGNALING_URL: ${{ vars.HOPLINE_SIGNALING_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Checksums
        working-directory: release-files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Hopline ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-files/*
